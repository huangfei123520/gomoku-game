<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="五子棋">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>五子棋 - 局域网对战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="home" class="screen active">
            <div class="title">
                <h1>五子棋</h1>
                <p>局域网双人对战 · AI人机对战</p>
            </div>
            <div class="menu">
                <button class="btn primary" id="btn-ai">人机对战</button>
                <button class="btn primary" id="btn-create">创建房间</button>
                <button class="btn primary" id="btn-join">加入房间</button>
                <div class="qr-help">
                    <p>创建房间后生成二维码，另一方扫码即可加入对战</p>
                    <p>支持WebRTC P2P直连，无需服务器</p>
                </div>
            </div>
            <footer class="footer">
                <p>纯网页实现 · 安卓iOS直接打开使用</p>
            </footer>
        </div>

        <!-- 创建房间 -->
        <div id="create-room" class="screen">
            <div class="header">
                <h2>创建房间</h2>
                <button class="btn back" id="back-create">返回</button>
            </div>
            <div class="content-center">
                <p>等待对手加入...</p>
                <div id="qrcode" class="qrcode"></div>
                <div class="room-id-area">
                    <span class="room-id-label">房间ID:</span>
                    <span id="room-id" class="room-id-value"></span>
                    <button class="btn icon-btn" id="btn-copy-roomid" title="复制房间ID">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
                <p class="hint">对方扫码或输入房间ID即可加入</p>
            </div>
        </div>

        <!-- 加入房间 -->
        <div id="join-room" class="screen">
            <div class="header">
                <h2>加入房间</h2>
                <button class="btn back" id="back-join">返回</button>
            </div>
            <div class="content-center">
                <p>输入房间ID</p>
                <div class="input-group">
                    <input type="text" id="input-room-id" placeholder="输入房间ID" autocomplete="off">
                    <button class="btn icon-btn" id="btn-paste" title="粘贴">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
                <button class="btn primary" id="btn-confirm-join">加入</button>
                <p class="hint">对方扫码或输入房间ID即可加入</p>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game" class="screen">
            <div class="game-header">
                <div class="status" id="game-status">等待开始</div>
                <button class="btn back" id="back-game">退出</button>
            </div>
            <div class="board-container">
                <canvas id="board"></canvas>
            </div>
            <div class="game-info">
                <div class="player-info">
                    <div class="player black">
                        <div class="piece-indicator black"></div>
                        <span id="black-name">黑方</span>
                    </div>
                    <div class="player white">
                        <div class="piece-indicator white"></div>
                        <span id="white-name">白方</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 结果弹窗 -->
        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="result-text">黑方胜利!</h2>
                <div class="modal-buttons">
                    <button class="btn primary" id="btn-restart">再来一局</button>
                    <button class="btn" id="btn-back-home">返回首页</button>
                </div>
            </div>
        </div>

        <!-- 确认弹窗 (用于P2P重新开始) -->
        <div id="confirm-modal" class="hidden">
            <div class="confirm-content">
                <h3>再来一局?</h3>
                <p id="confirm-text">对手请求再来一局，是否同意？</p>
                <div class="confirm-buttons">
                    <button class="btn cancel" id="btn-confirm-no">取消</button>
                    <button class="btn confirm" id="btn-confirm-yes">同意</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PeerJS 库 -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode 库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="game.js"></script>
    <script src="ai.js"></script>
    <script src="sound.js"></script>
    <script src="network.js"></script>
    <script src="app.js"></script>
</body>
</html>
